name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: speeddisk-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: speeddisk-linux-arm64
          - os: windows-latest
            asset: speeddisk-windows-x86_64.exe
          - os: macos-latest
            asset: speeddisk-macos-arm64
          - os: macos-15-intel
            asset: speeddisk-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        shell: bash
        run: |
          python -m pip install pyinstaller pillow
          if [ "$RUNNER_OS" = "Windows" ]; then python -m pip install windows-curses; fi
      - name: Build
        shell: bash
        run: |
          pyinstaller -F -n speeddisk --icon assets/speeddisk.ico speeddisk.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/speeddisk.exe "dist/${{ matrix.asset }}"; else mv dist/speeddisk "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version && ./dist/${{ matrix.asset }} . --headless --secs 1 --lang en
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
